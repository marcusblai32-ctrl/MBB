name: Build MBB Android and Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name mbb .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MBB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MBB-Android-APK
          path: MBB.apk
          if-no-files-found: error

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform if missing
        shell: pwsh
        run: |
          if (!(Test-Path windows)) { flutter create --platforms=windows --project-name mbb . }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows files
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          if (!(Test-Path "$out\mbb.exe")) { throw "mbb.exe was not found in $out" }
          Copy-Item "$out\mbb.exe" "MBB.exe"
          Compress-Archive -Path "$out\*" -DestinationPath "MBB-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MBB-Windows-ZIP
          path: MBB-Windows.zip
          if-no-files-found: error
